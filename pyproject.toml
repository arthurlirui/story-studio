[project]
name = "story-studio"
version = "1.0.0"
description = "多 Agent 协作的小说剧本创作平台（LLM API 驱动）"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1.0",
    "pyyaml>=6.0,<7.0",
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.27,<1.0",
]

[project.scripts]
ss = "cli.main:app"
ss-gui = "gui.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
]
cli = [
    "typer>=0.27,<1.0",
]
api = [
    "sse-starlette>=1.8,<3.0",
]
gui = [
    "dearpygui>=2.0,<3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# 显式声明包：避免 setuptools flat-layout 自动发现因 series/ skills/ 等数据
# 目录报 "Multiple top-level packages" 错误。
py-modules = []
packages = ["cli", "config", "agents", "deai", "short_story", "tools", "gui"]
